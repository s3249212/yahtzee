<!DOCTYPE html>
<html>
    <head>
        <title>JavaScript Yahtzee</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <table>
            <tr id="dice">
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
            </tr>
        </table>
        <button id="roll">Gooien!</button>

        <table>
            <tr>
                <th>Aces</th>
                <td id="aces"></td>
            </tr>
            <tr>
                <th>Twos</th>
                <td id="twos"></td>
            </tr>
            <tr>
                <th>Threes</th>
                <td id="threes"></td>
            </tr>
            <tr>
                <th>Fours</th>
                <td id="fours"></td>
            </tr>
            <tr>
                <th>Fives</th>
                <td id="fives"></td>
            </tr>
            <tr>
                <th>Sixes</th>
                <td id="sixes"></td>
            </tr>
            <tr>
                <th>Total Points</th>
                <td id="total_before_bonus"></td>
            </tr>
            
            <tr>
                <th>Bonus (Score over 63)</th>
                <td id="bonus"></td>
            </tr>
            <tr>
                <th>Total Part 1</th>
                <td class="total_p1"></td>
            </tr>
            <tr>
                <th>Three of a Kind</th>
                <td id="3oak"></td>
            </tr>
            <tr>
                <th>Four of a Kind</th>
                <td id="4oak"></td>
            </tr>
            <tr>
                <th>Full House</th>
                <td id="full_house"></td>
            </tr>
            <tr>
                <th>Small Straight</th>
                <td id="small_straight"></td>
            </tr>
            <tr>
                <th>Large Straight</th>
                <td id="large_straight"></td>
            </tr>
            <tr>
                <th>Top Score</th>
                <td id="top_score"></td>
            </tr>
            <tr>
                <th>Chance</th>
                <td id="chance"></td>
            </tr>
            
            <tr>
                <th>Total Part 1</th>
                <td class="total_p1"></td>
            </tr>
            <tr>
                <th>Total Part 2</th>
                <td id="total_p2"></td>
            </tr>
            
            <tr>
                <th>Total</th>
                <td id="total"></td>
            </tr>
        </table>

        <script src="script.js"></script>
    </body>
</html>
